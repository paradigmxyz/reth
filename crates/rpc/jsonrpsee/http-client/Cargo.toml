[package]
name = "jsonrpsee-http-client"
description = "JSON-RPC HTTP client"
version = "0.26.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
homepage.workspace = true
repository.workspace = true

[lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"

[lints.clippy]
manual_async_fn = "allow"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "logging", "ring"], optional = true }
hyper-util = { workspace = true, features = ["client", "client-legacy", "tokio", "http1", "http2"] }
http-body = { version = "1" }
jsonrpsee-types = { workspace = true }
jsonrpsee-core = { workspace = true, features = ["client", "http-helpers"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"], optional = true }
rustls-platform-verifier = { version = "0.5", optional = true }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true, features = ["util"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
jsonrpsee-test-utils = { path = "../test-utils" }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }

[features]
default = ["tls"]
tls = ["hyper-rustls", "rustls", "rustls-platform-verifier"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.playground]
all-features = true
