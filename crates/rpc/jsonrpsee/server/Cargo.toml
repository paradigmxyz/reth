[package]
name = "jsonrpsee-server"
description = "JSON-RPC server that supports HTTP and WebSocket transports"
version = "0.26.1"
authors = ["Parity Technologies <admin@parity.io>", "Pierre Krieger <pierre.krieger1708@gmail.com>"]
edition.workspace = true
rust-version.workspace = true
license = "MIT"
homepage.workspace = true
repository.workspace = true

[lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"

[lints.clippy]
manual_async_fn = "allow"
result_large_err = "allow"

[dependencies]
futures-util = { workspace = true, features = ["io", "async-await-macro", "std"] }
http = { workspace = true }
http-body = { version = "1" }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "service", "server-auto"] }
jsonrpsee-core = { workspace = true, features = ["server", "http-helpers"] }
jsonrpsee-types = { workspace = true }
pin-project = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
soketto = { version = "0.8.1", features = ["http"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
jsonrpsee-test-utils = { path = "../test-utils" }
test-case.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }
tower = { workspace = true, features = ["limit", "timeout"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
