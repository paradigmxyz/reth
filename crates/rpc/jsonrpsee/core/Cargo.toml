[package]
name = "jsonrpsee-core"
description = "Utilities for jsonrpsee"
version = "0.26.1"
authors = ["Parity Technologies <admin@parity.io>", "Pierre Krieger <pierre.krieger1708@gmail.com>"]
edition.workspace = true
rust-version.workspace = true
license = "MIT"
homepage.workspace = true
repository.workspace = true

[lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"

[lints.clippy]
manual_async_fn = "allow"

[dependencies]
jsonrpsee-types = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["raw_value", "std"] }
tracing = { workspace = true, features = ["std"] }

# optional deps
futures-util = { workspace = true, features = ["alloc"], optional = true }
http = { workspace = true, optional = true }
bytes = { workspace = true, features = ["std"], optional = true }
http-body = { version = "1", optional = true }
http-body-util = { workspace = true, optional = true }
rustc-hash = { workspace = true, features = ["std"], optional = true }
rand = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }

[features]
default = []
http-helpers = ["bytes", "futures-util", "http-body", "http-body-util", "http"]
server = [
    "bytes",
    "futures-util",
    "rustc-hash/std",
    "parking_lot",
    "rand",
    "tokio/rt",
    "tokio/sync",
    "tokio/macros",
    "tokio/time",
    "tower",
    "pin-project",
]

[dev-dependencies]
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "rt"] }
jsonrpsee = { path = "../jsonrpsee", features = ["server", "macros"] }
http-body-util = { workspace = true }

# Only used by doc tests, which cargo-udeps does not see.
[package.metadata.cargo-udeps.ignore]
development = ["jsonrpsee"]
