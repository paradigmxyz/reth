[package]
name = "jsonrpsee-test-utils"
version = "0.26.1"
authors = ["Parity Technologies <admin@parity.io>", "Pierre Krieger <pierre.krieger1708@gmail.com>"]
edition.workspace = true
rust-version.workspace = true
license = "MIT"
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures-channel = { version = "0.3.14", default-features = false }
futures-util = { workspace = true, features = ["default"] }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server-auto", "tokio", "client-legacy"] }
http-body-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { workspace = true, features = ["raw_value"] }
soketto = { version = "0.8.1", features = ["http"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
