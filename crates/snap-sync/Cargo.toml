[package]
name = "reth-snap-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "snap/2 state synchronization"

[package.metadata.cargo-udeps.ignore]
# Used by snap/BAL tests, which are disabled when account-ext is enabled by --all-features.
development = ["reth-evm-ethereum", "reth-stages", "reth-stages-api"]

[lints]
workspace = true

[dependencies]
# reth
reth-db-api.workspace = true
reth-downloaders.workspace = true
reth-eth-wire-types.workspace = true
reth-network-p2p.workspace = true
reth-network-peers.workspace = true
reth-primitives-traits = { workspace = true, features = ["eip7928"] }
reth-storage-api = { workspace = true, features = ["db-api"] }
reth-stages-types.workspace = true
reth-storage-errors.workspace = true
reth-tasks.workspace = true
reth-trie-common.workspace = true

# alloy
alloy-eip7928.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true

# revm
revm.workspace = true

# misc
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
evm2.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true
futures.workspace = true
reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm.workspace = true
reth-evm-ethereum = { workspace = true, features = ["std"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-stages.workspace = true
reth-stages-api.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
account-ext = [
    "reth-storage-api/account-ext",
    "evm2/account-ext",
    "revm/account-ext",
]
