[package]
name = "reth-snap-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "snap/2 state synchronization"

[lints]
workspace = true

[dependencies]
# reth
reth-db-api.workspace = true
reth-downloaders.workspace = true
reth-eth-wire-types.workspace = true
reth-network-p2p.workspace = true
reth-network-peers.workspace = true
reth-primitives-traits = { workspace = true, features = ["eip7928"] }
reth-prune-types.workspace = true
reth-storage-api = { workspace = true, features = ["db-api", "std"] }
reth-stages-types.workspace = true
reth-storage-errors.workspace = true
reth-tasks.workspace = true
reth-trie-common.workspace = true

# alloy
alloy-eip7928.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true

# revm
revm.workspace = true

# misc
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# test-utils
alloy-consensus = { workspace = true, optional = true }
reth-provider = { workspace = true, optional = true }

[dev-dependencies]
alloy-consensus.workspace = true
reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm.workspace = true
reth-evm-ethereum.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }
reth-stages.workspace = true
reth-stages-api.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
test-utils = [
    "dep:alloy-consensus",
    "dep:reth-provider",
    "reth-provider/test-utils",
    "reth-chainspec/test-utils",
    "reth-db-api/test-utils",
    "reth-downloaders/test-utils",
    "reth-ethereum-primitives/test-utils",
    "reth-evm/test-utils",
    "reth-evm-ethereum/test-utils",
    "reth-network-p2p/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-prune-types/test-utils",
    "reth-stages/test-utils",
    "reth-stages-api/test-utils",
    "reth-stages-types/test-utils",
    "reth-tasks/test-utils",
    "reth-trie-common/test-utils",
]
