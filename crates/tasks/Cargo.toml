[package]
name = "reth-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Task management"

[lints]
workspace = true

[dependencies]
reth-concurrency = { workspace = true, features = ["std"] }

# async
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }
tracing-futures.workspace = true
futures-util = { workspace = true, features = ["std"] }

# metrics
reth-metrics.workspace = true
metrics.workspace = true

# misc
dashmap.workspace = true
shuttle = { workspace = true, optional = true }
thread-priority.workspace = true
tracing.workspace = true
thiserror.workspace = true

# feature `rayon`
crossbeam-utils = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

[features]
rayon = ["dep:crossbeam-utils", "pin-project"]
test-utils = ["reth-concurrency/test-utils"]
fuzz = ["reth-concurrency/fuzz", "dep:shuttle"]
