[package]
name = "reth-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Task management"

[lints]
workspace = true

[dependencies]
# executor
crossbeam-channel.workspace = true
either = { workspace = true, optional = true }
rayon.workspace = true
shuttle = { workspace = true, optional = true }
shuttle-sync.workspace = true
shuttle-parking_lot.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# async
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }
tracing-futures.workspace = true
futures-util = { workspace = true, features = ["std"] }

# metrics
reth-metrics.workspace = true
metrics.workspace = true

# misc
parking_lot.workspace = true
dashmap.workspace = true
thread-priority.workspace = true
tracing.workspace = true
thiserror.workspace = true

# feature `rayon`
crossbeam-utils = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

[features]
rayon = ["dep:crossbeam-utils", "pin-project"]
test-utils = []
fuzz = ["dep:either", "dep:shuttle", "shuttle-sync/shuttle", "shuttle-parking_lot/shuttle"]

# The all-features udeps job selects fuzz, which replaces the native Rayon backend.
[package.metadata.cargo-udeps.ignore]
normal = ["rayon"]
