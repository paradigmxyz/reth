reth-stages-api = { workspace = true, features = ["test-utils"] }
reth-prune.workspace = true
reth-static-file.workspace = true
reth-consensus.workspace = true

[features]
default = []
gmp = ["evm2/gmp", "reth-evm/gmp", "reth-evm-ethereum/gmp"]
account-ext = [
    "reth-provider/account-ext",
    "reth-evm/account-ext",
    "alloy-genesis/account-ext",
    "alloy-rpc-types-eth/account-ext",
    "reth-primitives-traits/account-ext",
    "reth-revm/account-ext",
    "reth-stages-types/account-ext",
    "reth-rpc/account-ext",
    "reth-rpc-eth-api/account-ext",
    "evm2/account-ext",
    "reth-execution-types/account-ext",
]
jit = ["reth-evm-ethereum/jit"]
asm-keccak = [
    "alloy-primitives/asm-keccak",
    "reth-node-core/asm-keccak",
    "reth-evm/asm-keccak",
    "reth-evm-ethereum/asm-keccak",
    "evm2/asm-keccak",
    "reth-execution-types/asm-keccak",
]
portable = [
    "reth-evm/portable",
    "reth-evm-ethereum/portable",
    "evm2/portable",
    "reth-execution-types/portable",
    "reth-revm/portable",
]
keccak-cache-global = [
    "alloy-primitives/keccak-cache-global",
    "reth-node-core/keccak-cache-global",
]
js-tracer = [
    "reth-node-builder/js-tracer",
    "reth-rpc/js-tracer",
    "reth-rpc-eth-api/js-tracer",
    "reth-rpc-eth-types/js-tracer",
]
test-utils = [
    "reth-node-builder/test-utils",
    "reth-chainspec/test-utils",
    "reth-network/test-utils",
    "reth-ethereum-primitives/test-utils",
    "reth-db/test-utils",
    "reth-provider/test-utils",
    "reth-transaction-pool/test-utils",
    "reth-evm/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-evm-ethereum/test-utils",
    "reth-stages-types/test-utils",
    "reth-tasks/test-utils",
    "reth-trie-common/test-utils",
    "reth-revm/test-utils",
    "reth-stages/test-utils",
    "reth-downloaders/test-utils",
    "reth-network-p2p/test-utils",
    "reth-consensus/test-utils",
    "reth-engine-tree/test-utils",
    "reth-stages-api/test-utils",
]
