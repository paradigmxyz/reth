[package]
name = "reth-execution-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
reth-ethereum-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-trie-common.workspace = true

revm.workspace = true
evm2.workspace = true

# alloy
alloy-evm.workspace = true
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-eip7928.workspace = true
alloy-eips.workspace = true
alloy-rlp = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }

derive_more.workspace = true

[dev-dependencies]
reth-primitives-traits = { workspace = true, features = ["test-utils", "arbitrary"] }
reth-ethereum-primitives = { workspace = true, features = ["arbitrary"] }
alloy-primitives = { workspace = true, features = ["rand", "arbitrary"] }
arbitrary.workspace = true
bincode.workspace = true
rmp-serde.workspace = true
rand.workspace = true
alloy-rlp.workspace = true

[features]
asm-keccak = [
    "evm2/asm-keccak",
    "alloy-evm/asm-keccak",
    "alloy-primitives/asm-keccak",
    "revm/asm-keccak",
]
c-kzg = ["evm2/c-kzg"]
blst = ["evm2/blst"]
portable = [
    "evm2/portable",
    "revm/portable",
]
p256-aws-lc-rs = ["evm2/p256-aws-lc-rs"]
default = ["std"]
serde = [
    "dep:serde",
    "rand/serde",
    "revm/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "reth-primitives-traits/serde",
    "alloy-consensus/serde",
    "reth-trie-common/serde",
    "reth-ethereum-primitives/serde",
    "evm2/serde",
    "alloy-eip7928/serde",
]
serde-bincode-compat = [
    "serde",
    "alloy-rlp",
    "reth-trie-common/serde-bincode-compat",
    "serde_with",
    "alloy-consensus/serde-bincode-compat",
    "alloy-eips/serde-bincode-compat",
]
std = [
    "alloy-eip7928/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "revm/std",
    "serde?/std",
    "reth-primitives-traits/std",
    "alloy-consensus/std",
    "serde_with?/std",
    "derive_more/std",
    "reth-ethereum-primitives/std",
    "reth-trie-common/std",
    "alloy-evm/std",
    "alloy-rlp?/std",
    "evm2/std",
]
account-ext = [
    "evm2/account-ext",
    "reth-ethereum-primitives/account-ext",
    "reth-trie-common/account-ext",
    "revm/account-ext",
]
