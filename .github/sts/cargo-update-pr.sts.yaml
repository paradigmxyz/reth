# Only the pinned dependency updater on main may create dependency PRs.
subject:
  - repo:paradigmxyz/reth:ref:refs/heads/main
  - repo:paradigmxyz@97369466/reth@537233603:ref:refs/heads/main

claim_pattern:
  repository_id: '537233603'
  event_name: '(schedule|workflow_dispatch)'
  workflow_ref: 'paradigmxyz/reth/\.github/workflows/dependencies\.yml@refs/heads/main'
  job_workflow_ref: 'tempoxyz/gh-actions/\.github/workflows/cargo-update-pr\.yml@e8f9d5c23ab43d0645c6d50fb73e98b362cdec02'

permissions:
  contents: write
  pull_requests: write
