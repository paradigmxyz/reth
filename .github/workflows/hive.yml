# Runs `ethereum/hive` tests.

name: hive

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-reth:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-test.yml
    with:
      hive_target: hive
      artifact_name: "reth"
    secrets: inherit

  prepare-hive:
    if: github.repository == 'paradigmxyz/reth-oss'
    timeout-minutes: 45
    runs-on: ${{ github.repository == 'paradigmxyz/reth-oss' && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - amsterdam
          - bogota
          # - osaka
    name: Prepare Hive - ${{ matrix.variant == 'amsterdam' && 'Amsterdam' || matrix.variant == 'bogota' && 'Bogota' || 'Osaka' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout hive tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Soubhik-10/hive
          ref: feat/eip8141-frames
          path: hivetests
          persist-credentials: false

      - name: Get hive commit hash
        id: hive-commit
        run: echo "hash=$(cd hivetests && git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.13.1"
      - run: go version

      - name: Restore hive assets cache
        id: cache-hive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./hive_assets
          key: hive-assets-${{ matrix.variant }}-${{ steps.hive-commit.outputs.hash }}-${{ hashFiles('.github/scripts/hive/build_simulators.sh') }}

      - name: Build hive assets
        if: steps.cache-hive.outputs.cache-hit != 'true'
        run: .github/scripts/hive/build_simulators.sh ${{ matrix.variant }}

      - name: Load cached Docker images
        if: steps.cache-hive.outputs.cache-hit == 'true'
        run: |
          cd hive_assets
          for tar_file in *.tar; do
            if [ -f "$tar_file" ]; then
              echo "Loading $tar_file..."
              docker load -i "$tar_file"
            fi
          done
          # Make hive binary executable
          chmod +x hive

      - name: Upload hive assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive_assets_${{ matrix.variant }}
          path: ./hive_assets
  test-amsterdam:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # ethereum/rpc to be deprecated:
        # https://github.com/ethereum/hive/pull/1117
        scenario:
          - sim: smoke/genesis
          # - sim: smoke/network
          # - sim: ethereum/sync
          # - sim: devp2p
          #   limit: discv4
          # # started failing after https://github.com/ethereum/go-ethereum/pull/31843, no
          # # action on our side, remove from here when we get unexpected passes on these tests
          # # - sim: devp2p
          # #  limit: eth
          # #  include:
          # #    - MaliciousHandshake
          # #    # failures tracked in https://github.com/paradigmxyz/reth/issues/14825
          # #    - Status
          # #    - GetBlockHeaders
          # #    - ZeroRequestID
          # #    - GetBlockBodies
          # #    - Transaction
          # #    - NewPooledTxs
          # - sim: devp2p
          #   limit: discv5
          #   include:
          #     # failures tracked at https://github.com/paradigmxyz/reth/issues/14825
          #     - PingLargeRequestID
          - sim: ethereum/engine
            limit: engine-exchange-capabilities
          # - sim: ethereum/engine
          #   limit: engine-withdrawals
          # - sim: ethereum/engine
          #   limit: engine-auth
          # - sim: ethereum/engine
          #   limit: engine-api
          # - sim: ethereum/engine
          #   limit: cancun
          # # eth_ rpc methods
          - sim: ethereum/rpc-compat
            include:
          #     - eth_blockNumber
          #     - eth_call
              - eth_chainId
          #     - eth_createAccessList
          #     - eth_estimateGas
          #     - eth_feeHistory
          #     - eth_getBalance
          #     - eth_getBlockBy
          #     - eth_getBlockTransactionCountBy
          #     - eth_getCode
          #     - eth_getProof
          #     - eth_getStorage
          #     - eth_getTransactionBy
          #     - eth_getTransactionCount
          #     - eth_getTransactionReceipt
          #     - eth_sendRawTransaction
          #     - eth_syncing
          #     # debug_ rpc methods
          #     - debug_

          # # consume-engine
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/amsterdam.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/osaka.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/prague.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/cancun.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/shanghai.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/berlin.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/istanbul.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/homestead.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/frontier.*
          # - sim: ethereum/eels/consume-engine
          #   limit: .*tests/paris.*

          # # consume-rlp
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/amsterdam.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/osaka.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/prague.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/cancun.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/shanghai.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/berlin.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/istanbul.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/homestead.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/frontier.*
          # - sim: ethereum/eels/consume-rlp
          #   limit: .*tests/paris.*

          # # execute-blobs
          # - sim: ethereum/eels/execute-blobs
          #   limit: .*tests/amsterdam.*
          # - sim: ethereum/eels/execute-blobs
          #   limit: .*tests/osaka.*
    needs:
      - build-reth
      - prepare-hive
    name: Hive-Amsterdam / ${{ matrix.scenario.sim }}${{ matrix.scenario.limit && format(' - {0}', matrix.scenario.limit) }}
    # Use larger runners for eels tests to avoid OOM runner crashes
    runs-on: ${{ github.repository == 'paradigmxyz/reth-oss' && (contains(matrix.scenario.sim, 'eels') && 'depot-ubuntu-latest-8' || 'depot-ubuntu-latest-4') || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Download hive assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hive_assets_amsterdam
          path: /tmp

      - name: Download reth image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reth
          path: /tmp

      - name: Load Docker images
        env:
          SCENARIO_SIM: ${{ matrix.scenario.sim }}
        run: .github/scripts/hive/load_images.sh "$SCENARIO_SIM"

      - name: Move hive binary
        run: |
          mv /tmp/hive /usr/local/bin
          chmod +x /usr/local/bin/hive

      - name: Checkout hive tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Soubhik-10/hive
          ref: feat/eip8141-frames
          path: hivetests
          persist-credentials: false

      - name: Run simulator
        env:
          SCENARIO_SIM: ${{ matrix.scenario.sim }}
          SCENARIO_LIMIT: ${{ matrix.scenario.limit }}
          SCENARIO_TESTS: ${{ join(matrix.scenario.include, '|') }}
        run: |
          LIMIT="$SCENARIO_LIMIT"
          TESTS="$SCENARIO_TESTS"
          if [ -n "$LIMIT" ] && [ -n "$TESTS" ]; then
            FILTER="$LIMIT/$TESTS"
          elif [ -n "$LIMIT" ]; then
            FILTER="$LIMIT"
          elif [ -n "$TESTS" ]; then
            FILTER="/$TESTS"
          else
            FILTER="/"
          fi
          echo "filter: $FILTER"
          .github/scripts/hive/run_simulator.sh "$SCENARIO_SIM" "$FILTER" "amsterdam"

      - name: Parse hive output
        run: |
          find hivetests/workspace/logs -type f -name "*.json" ! -name "hive.json" | xargs -I {} python .github/scripts/hive/parse.py {} --exclusion .github/scripts/hive/expected_failures.yaml --ignored .github/scripts/hive/ignored_tests.yaml

      - name: Print simulator output
        if: ${{ failure() }}
        run: |
          cat hivetests/workspace/logs/*simulator*.log

      - name: Print reth client logs
        if: ${{ failure() }}
        run: .github/scripts/hive/print_client_logs.sh

  test-bogota:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # ethereum/rpc to be deprecated:
        # https://github.com/ethereum/hive/pull/1117
        scenario:
          # Bogota is currently narrowed to the EIP-8141 fixtures only.
          - sim: ethereum/eels/consume-engine
            name: all
            limit: '.*8141.*'
            include: []
          # consume-rlp
          - sim: ethereum/eels/consume-rlp
            name: all
            limit: '.*8141.*'
            include: []
          # Isolate EIP-8141 failures by test module.
          - sim: ethereum/eels/consume-engine
            name: admission-validity
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_admission_validity\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: admission-validity
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_admission_validity\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: block-access-lists
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_block_access_lists\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: block-access-lists
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_block_access_lists\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: expiry-verifier
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_expiry_verifier\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: expiry-verifier
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_expiry_verifier\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: frame-transactions
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_frame_transactions\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: frame-transactions
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_frame_transactions\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: gas-settlement
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_gas_settlement\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: gas-settlement
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_gas_settlement\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: introspection
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_introspection\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: introspection
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_introspection\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: state-gas
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_state_gas\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: state-gas
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_state_gas\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: static-validity
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_static_validity\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: static-validity
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_static_validity\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: target-resolution
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_target_resolution\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: target-resolution
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_target_resolution\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: value-transfer
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_value_transfer\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: value-transfer
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_value_transfer\.py.*'
            include: []
          - sim: ethereum/eels/consume-engine
            name: warmth
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_warmth\.py.*'
            include: []
          - sim: ethereum/eels/consume-rlp
            name: warmth
            limit: '.*tests/amsterdam/eip8141_frame_transactions/test_warmth\.py.*'
            include: []
          # Run the valid EIP-8141 cases separately so expected-invalid cases do not obscure
          # failures in transactions that should execute successfully.
          - sim: ethereum/eels/consume-engine
            name: valid
            limit: '.*8141.*'
            include:
              - 'test_admission_validity\.py::(test_admission_constraints.*max_cost_within_bound|test_nonce_at_maximum|test_block_capacity_reservations.*(execution_reservation_at_limit|state_reservation_at_limit)).*'
              - 'test_block_access_lists\.py::.*'
              - 'test_expiry_verifier\.py::test_expiry_verifier_frame.*(future_expiry|expiry_at_block_timestamp).*'
              - 'test_frame_transactions\.py::(test_transfer_with_default_code|test_contract_sender_approves|test_eoa_paymaster|test_atomic_batch_rollback|test_frame_revert_discards_the_approval_it_granted.*returns|test_refused_approval_reverts_only_its_call_frame).*'
              - 'test_gas_settlement\.py::.*'
              - 'test_introspection\.py::.*'
              - 'test_state_gas\.py::(test_same_frame_refill|test_cross_frame_refill|test_state_gas_exhaustion|test_approve_creates_sender|test_refill_after_intermediate_modification|test_batch_unroll_restores_refilled_receipt|test_frame_revert_restores_refilled_receipt).*'
              - 'test_static_validity\.py::test_invalid_tx_fields(_transaction)?\[.*(priority_fee_equals_max_fee|frame_count_at_max)\].*'
              - 'test_static_validity\.py::test_frame_constraints(_transaction)?\[.*(sender_frame_with_value|approve_execution_frame_with_explicit_sender_target|atomic_batch_of_default_frames|approval_scope_after_batch_terminator)\].*'
              - 'test_static_validity\.py::test_expiry_verifier_constraints(_transaction)?\[.*(default_frame_targeting_expiry_verifier|verify_frame_with_expiry_data_to_other_target)\].*'
              - 'test_static_validity\.py::test_signature_constraints(_transaction)?\[.*(secp256k1_digest_entry|arbitrary_entry|p256_valid_entry)\].*'
              - 'test_static_validity\.py::test_gas_limit_cap_from_frame_gas(_transaction)?\[.*at_cap\].*'
              - 'test_static_validity\.py::test_gas_limit_cap_exempts_state_gas(_transaction)?(\[.*\])?.*'
              - 'test_static_validity\.py::test_gas_limit_cap_from_calldata_floor(_transaction)?\[.*below_cap\].*'
              - 'test_target_resolution\.py::(test_precompile_target|test_precompile_target_rejecting_its_input|test_verify_frame_target_above_the_precompile_gap|test_delegated_target_entry_charge|test_dead_target_entry_charge|test_delegated_to_precompile_target|test_frame_entry_gas_boundary|test_entry_charge_halt_unrolls_batch|test_default_code_entry_gas_shortfall.*affordable|test_verify_frame_delegated_to_precompile_target).*'
              - 'test_value_transfer\.py::test_value_transfer\[.*'
              - 'test_warmth\.py::.*'
          - sim: ethereum/eels/consume-rlp
            name: valid
            limit: '.*8141.*'
            include:
              - 'test_admission_validity\.py::(test_admission_constraints.*max_cost_within_bound|test_nonce_at_maximum|test_block_capacity_reservations.*(execution_reservation_at_limit|state_reservation_at_limit)).*'
              - 'test_block_access_lists\.py::.*'
              - 'test_expiry_verifier\.py::test_expiry_verifier_frame.*(future_expiry|expiry_at_block_timestamp).*'
              - 'test_frame_transactions\.py::(test_transfer_with_default_code|test_contract_sender_approves|test_eoa_paymaster|test_atomic_batch_rollback|test_frame_revert_discards_the_approval_it_granted.*returns|test_refused_approval_reverts_only_its_call_frame).*'
              - 'test_gas_settlement\.py::.*'
              - 'test_introspection\.py::.*'
              - 'test_state_gas\.py::(test_same_frame_refill|test_cross_frame_refill|test_state_gas_exhaustion|test_approve_creates_sender|test_refill_after_intermediate_modification|test_batch_unroll_restores_refilled_receipt|test_frame_revert_restores_refilled_receipt).*'
              - 'test_static_validity\.py::test_invalid_tx_fields(_transaction)?\[.*(priority_fee_equals_max_fee|frame_count_at_max)\].*'
              - 'test_static_validity\.py::test_frame_constraints(_transaction)?\[.*(sender_frame_with_value|approve_execution_frame_with_explicit_sender_target|atomic_batch_of_default_frames|approval_scope_after_batch_terminator)\].*'
              - 'test_static_validity\.py::test_expiry_verifier_constraints(_transaction)?\[.*(default_frame_targeting_expiry_verifier|verify_frame_with_expiry_data_to_other_target)\].*'
              - 'test_static_validity\.py::test_signature_constraints(_transaction)?\[.*(secp256k1_digest_entry|arbitrary_entry|p256_valid_entry)\].*'
              - 'test_static_validity\.py::test_gas_limit_cap_from_frame_gas(_transaction)?\[.*at_cap\].*'
              - 'test_static_validity\.py::test_gas_limit_cap_exempts_state_gas(_transaction)?(\[.*\])?.*'
              - 'test_static_validity\.py::test_gas_limit_cap_from_calldata_floor(_transaction)?\[.*below_cap\].*'
              - 'test_target_resolution\.py::(test_precompile_target|test_precompile_target_rejecting_its_input|test_verify_frame_target_above_the_precompile_gap|test_delegated_target_entry_charge|test_dead_target_entry_charge|test_delegated_to_precompile_target|test_frame_entry_gas_boundary|test_entry_charge_halt_unrolls_batch|test_default_code_entry_gas_shortfall.*affordable|test_verify_frame_delegated_to_precompile_target).*'
              - 'test_value_transfer\.py::test_value_transfer\[.*'
              - 'test_warmth\.py::.*'
    needs:
      - build-reth
      - prepare-hive
    name: Hive-Bogota / ${{ matrix.scenario.name }} / ${{ matrix.scenario.sim }}${{ matrix.scenario.limit && format(' - {0}', matrix.scenario.limit) }}
    # Use larger runners for eels tests to avoid OOM runner crashes
    runs-on: ${{ github.repository == 'paradigmxyz/reth-oss' && (contains(matrix.scenario.sim, 'eels') && 'depot-ubuntu-latest-8' || 'depot-ubuntu-latest-4') || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Download hive assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hive_assets_bogota
          path: /tmp

      - name: Download reth image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reth
          path: /tmp

      - name: Load Docker images
        env:
          SCENARIO_SIM: ${{ matrix.scenario.sim }}
        run: .github/scripts/hive/load_images.sh "$SCENARIO_SIM"

      - name: Move hive binary
        run: |
          mv /tmp/hive /usr/local/bin
          chmod +x /usr/local/bin/hive

      - name: Checkout hive tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Soubhik-10/hive
          ref: feat/eip8141-frames
          path: hivetests
          persist-credentials: false

      - name: Run simulator
        env:
          SCENARIO_SIM: ${{ matrix.scenario.sim }}
          SCENARIO_LIMIT: ${{ matrix.scenario.limit }}
          SCENARIO_TESTS: ${{ join(matrix.scenario.include, '|') }}
        run: |
          LIMIT="$SCENARIO_LIMIT"
          TESTS="$SCENARIO_TESTS"
          if [ -n "$LIMIT" ] && [ -n "$TESTS" ]; then
            FILTER="$LIMIT/$TESTS"
          elif [ -n "$LIMIT" ]; then
            FILTER="$LIMIT"
          elif [ -n "$TESTS" ]; then
            FILTER="/$TESTS"
          else
            FILTER="/"
          fi
          echo "filter: $FILTER"
          .github/scripts/hive/run_simulator.sh "$SCENARIO_SIM" "$FILTER" "bogota"

      - name: Parse hive output
        run: |
          find hivetests/workspace/logs -type f -name "*.json" ! -name "hive.json" | xargs -I {} python .github/scripts/hive/parse.py {} --exclusion .github/scripts/hive/expected_failures.yaml --ignored .github/scripts/hive/ignored_tests.yaml

      - name: Print simulator output
        if: ${{ failure() }}
        run: |
          cat hivetests/workspace/logs/*simulator*.log

      - name: Print reth client logs
        if: ${{ failure() }}
        run: .github/scripts/hive/print_client_logs.sh

