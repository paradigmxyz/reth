# Checks reth compilation against alloy branches to detect breaking changes.
# Run on-demand via workflow_dispatch.

name: Check Alloy Breaking Changes

on:
  workflow_dispatch:
    inputs:
      alloy_branch:
        description: 'Branch/rev for alloy-rs/alloy (leave empty to skip)'
        required: false
        type: string
      alloy_evm_branch:
        description: 'Branch/rev for alloy-rs/evm (alloy-evm, alloy-op-evm) (leave empty to skip)'
        required: false
        type: string
      op_alloy_branch:
        description: 'Branch/rev for alloy-rs/op-alloy (leave empty to skip)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  check:
    name: Check compilation with patched alloy
    runs-on: ${{ github.repository == 'paradigmxyz/reth' && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 60
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@7e2ea6e1a8f5a22f16c2d4b389ffde25da93fa1b # 2026-09-22T22-21-59Z-7e2ea6e1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1

      - run: .github/scripts/install_llvm.sh ubuntu

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Apply alloy patches
        env:
          ALLOY_BRANCH: ${{ inputs.alloy_branch }}
          ALLOY_EVM_BRANCH: ${{ inputs.alloy_evm_branch }}
          OP_ALLOY_BRANCH: ${{ inputs.op_alloy_branch }}
        run: |
          ARGS=""
          if [ -n "$ALLOY_BRANCH" ]; then
            ARGS="$ARGS --alloy $ALLOY_BRANCH"
          fi
          if [ -n "$ALLOY_EVM_BRANCH" ]; then
            ARGS="$ARGS --evm $ALLOY_EVM_BRANCH"
          fi
          if [ -n "$OP_ALLOY_BRANCH" ]; then
            ARGS="$ARGS --op $OP_ALLOY_BRANCH"
          fi
          
          if [ -z "$ARGS" ]; then
            echo "No branches specified, nothing to patch"
            exit 1
          fi
          
          ./scripts/patch-alloy.sh $ARGS
          
          echo "=== Final patch section ==="
          tail -50 Cargo.toml

      - name: Check workspace
        run: cargo clippy --workspace --lib --examples --tests --benches --all-features --locked
        env:
          RUSTFLAGS: -D warnings
