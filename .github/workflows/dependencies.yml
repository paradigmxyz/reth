# Runs `cargo update` periodically.

name: Update Dependencies

on:
  schedule:
    # Run weekly
    - cron: "0 0 * * SUN"
  workflow_dispatch:
    # Needed so we can run it manually

permissions: {}

jobs:
  update:
    if: github.repository == 'paradigmxyz/reth'
    permissions:
      contents: read
      id-token: write
    uses: tempoxyz/gh-actions/.github/workflows/cargo-update-pr.yml@65b6b5834d9ad2b0d4b34d06baff37c143aa59eb # cargo-update-pr-cooldown
