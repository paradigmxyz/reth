name: Benchmark artifact state smoke
on:
  workflow_dispatch:
    inputs:
      expected:
        description: Expected restored feature SHA (empty on first run)
        default: ""
        type: string
      feature:
        description: Feature SHA to save (deliberately distinct from workflow SHA)
        default: "280a76318d7ab933f4a1536d1942ffeb4c742d1a"
        type: string
      fail:
        description: Fail after upload to test failed-run exclusion
        default: false
        type: boolean
permissions: {}
jobs:
  state:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        mode: [hourly, nightly, release]
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED: ${{ inputs.expected }}
      FEATURE_REF: ${{ inputs.feature }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Restore previous successful state
        run: test "$(bash .github/scripts/bench-state.sh "$GITHUB_REPOSITORY" "$MODE")" = "$EXPECTED"
      - name: Verify branch isolation
        run: test -z "$(GITHUB_REF_NAME=artifact-state-isolation-unwritten bash .github/scripts/bench-state.sh "$GITHUB_REPOSITORY" "$MODE")"
      - name: Prepare benchmark state
        run: |
          [[ "$FEATURE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/bench-state"
          printf '%s\n' "$FEATURE_REF" > "$RUNNER_TEMP/bench-state/feature-ref"
      - name: Save benchmark state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-state-${{ matrix.mode }}
          path: ${{ runner.temp }}/bench-state/feature-ref
          retention-days: 90
          if-no-files-found: error
          overwrite: true
      - name: Intentional failure
        if: inputs.fail
        run: exit 1
