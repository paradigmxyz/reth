name: Benchmark state smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DEREK_PAT }}
      STATE_NAME: BENCH_SMOKE_${{ github.run_id }}_LAST_FEATURE_REF
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Verify missing state
        run: test -z "$(bash .github/scripts/bench-state.sh get "$GITHUB_REPOSITORY" "$STATE_NAME")"
      - name: Write state
        id: write
        run: bash .github/scripts/bench-state.sh set "$GITHUB_REPOSITORY" "$STATE_NAME" "$GITHUB_SHA"
      - name: Read and update state
        run: |
          test "$(bash .github/scripts/bench-state.sh get "$GITHUB_REPOSITORY" "$STATE_NAME")" = "$GITHUB_SHA"
          previous=$(git rev-parse HEAD)
          bash .github/scripts/bench-state.sh set "$GITHUB_REPOSITORY" "$STATE_NAME" "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          test "$(bash .github/scripts/bench-state.sh get "$GITHUB_REPOSITORY" "$STATE_NAME")" = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      - name: Remove test state
        if: always() && steps.write.outcome == 'success'
        run: gh variable delete "$STATE_NAME" --repo "$GITHUB_REPOSITORY"
