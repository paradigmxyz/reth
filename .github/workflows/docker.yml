# Publishes Docker images.
#
# Triggers:
#   - Push tag v*: builds release (RC or latest)
#   - Schedule: builds nightly + profiling
#   - Manual: builds git-sha or nightly

name: docker

on:
  push:
    tags:
      - v*
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - git-sha
          - nightly
        default: git-sha
      dry_run:
        description: "Skip pushing images (dry run)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    if: github.repository == 'paradigmxyz/reth'
    name: Build Docker images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@d5402286a7abdfb7232173b3228d56473feb8a66 # 2026-09-29T02-04-45Z-d5402286
        with:
          toolchain: "1.95.0"

      - name: Check Reth dependencies through Aegis
        run: cargo fetch --locked --manifest-path Cargo.toml

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git info for vergen
        id: git
        run: |
          {
            echo "sha=${{ github.sha }}"
            echo "describe=$(git describe --always --tags)"
            echo "dirty=false"
          } >> "$GITHUB_OUTPUT"

      - name: Determine build parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "targets=ethereum" >> "$GITHUB_OUTPUT"

            # Add 'latest' tag for non-RC releases
            if [[ ! "$VERSION" =~ -rc ]]; then
              echo "ethereum_tags=${REGISTRY}/reth:${VERSION},${REGISTRY}/reth:latest" >> "$GITHUB_OUTPUT"
              {
                echo "ethereum_set<<EOF"
                echo "ethereum.tags=${REGISTRY}/reth:${VERSION}"
                echo "ethereum.tags=${REGISTRY}/reth:latest"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "ethereum_tags=${REGISTRY}/reth:${VERSION}"
                echo "ethereum_set=ethereum.tags=${REGISTRY}/reth:${VERSION}"
              } >> "$GITHUB_OUTPUT"
            fi

          elif [[ "${EVENT_NAME}" == "schedule" ]] || [[ "${BUILD_TYPE}" == "nightly" ]]; then
            {
              echo "targets=nightly"
              echo "ethereum_tags=${REGISTRY}/reth:nightly"
            } >> "$GITHUB_OUTPUT"
            {
              echo "ethereum_set<<EOF"
              echo "ethereum.tags=${REGISTRY}/reth:nightly"
              echo "ethereum.args.RETH_ENGINE_TXPOOL_PREWARMING=true"
              echo "*.args.RETH_ENGINE_PREWARM_REUSE=true"
              echo "*.args.RETH_DB_SYNC_MODE=safe-no-sync"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          else
            # git-sha build
            {
              echo "targets=ethereum"
              echo "ethereum_tags=${REGISTRY}/reth:${{ github.sha }}"
              echo "ethereum_set=ethereum.tags=${REGISTRY}/reth:${{ github.sha }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push images
        uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
        env:
          VERGEN_GIT_SHA: ${{ steps.git.outputs.sha }}
          VERGEN_GIT_DESCRIBE: ${{ steps.git.outputs.describe }}
          VERGEN_GIT_DIRTY: ${{ steps.git.outputs.dirty }}
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          files: docker-bake.hcl
          targets: ${{ steps.params.outputs.targets }}
          push: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          save: false
          load: false
          set: |
            ${{ steps.params.outputs.ethereum_set }}

      - name: Verify image architectures
        env:
          INPUT_ETHEREUM_TAGS: ${{ steps.params.outputs.ethereum_tags }}
          INPUT_TARGETS: ${{ steps.params.outputs.targets }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          ./.github/scripts/verify_image_arch.sh \
            "${INPUT_TARGETS}" \
            "ghcr.io/${{ github.repository_owner }}" \
            "${INPUT_ETHEREUM_TAGS}"

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: build
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Slack Webhook Action
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_COLOR: danger
          SLACK_ICON_EMOJI: ":rotating_light:"
          SLACK_USERNAME: "GitHub Actions"
          SLACK_TITLE: ":rotating_light: Nightly Docker Build Failed"
          SLACK_MESSAGE: |
            The scheduled nightly Docker build failed.

            *Commit:* `${{ github.sha }}`
            *Branch:* `${{ github.ref_name }}`
            *Run:* <https://github.com/paradigmxyz/reth/actions/runs/${{ github.run_id }}|View logs>

            *Action required:* Re-run the workflow or investigate the build failure.
          SLACK_FOOTER: "paradigmxyz/reth · docker.yml"
          MSG_MINIMAL: true
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Pages reth on-call through incident.io on failure, and resolves the same alert on the
  # next successful scheduled build. Skips when the incident.io secrets are not set.
  incident-io:
    name: Update incident.io alert
    runs-on: ubuntu-latest
    needs: build
    if: "!cancelled() && github.event_name == 'schedule' && github.repository == 'paradigmxyz/reth' && (needs.build.result == 'success' || needs.build.result == 'failure')"
    permissions: {}
    steps:
      - name: Send incident.io alert event
        env:
          INCIDENT_IO_URL: ${{ secrets.INCIDENT_IO_RETH_CI_URL }}
          INCIDENT_IO_TOKEN: ${{ secrets.INCIDENT_IO_RETH_CI_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$INCIDENT_IO_URL" ] || [ -z "$INCIDENT_IO_TOKEN" ]; then
            echo "::notice::INCIDENT_IO_RETH_CI_URL or INCIDENT_IO_RETH_CI_TOKEN is not set; skipping incident.io alert"
            exit 0
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$BUILD_RESULT" = "success" ]; then
            STATUS="resolved"
            TITLE="Reth nightly Docker build recovered"
            OUTCOME="succeeded"
          else
            STATUS="firing"
            TITLE="Reth nightly Docker build failed"
            OUTCOME="failed"
          fi
          DESCRIPTION=$(printf 'The scheduled nightly Docker build (docker.yml) %s.\nCommit: %s\nBranch: %s\nRun: %s\nRe-run the workflow if the failure is flaky; otherwise investigate the build.' \
            "$OUTCOME" "$SHA" "$BRANCH" "$RUN_URL")

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg status "$STATUS" \
            --arg run_url "$RUN_URL" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SHA" \
            --arg branch "$BRANCH" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{
              title: $title,
              description: $description,
              status: $status,
              deduplication_key: "reth:docker-nightly",
              source_url: $run_url,
              metadata: {
                team: "reth",
                repository: $repository,
                workflow: "docker.yml",
                mode: "nightly",
                sha: $sha,
                branch: $branch,
                run_id: $run_id,
                run_url: $run_url
              }
            }')

          curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            -X POST "$INCIDENT_IO_URL" \
            -H "Authorization: Bearer $INCIDENT_IO_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"
          echo
          echo "Sent incident.io $STATUS event for reth:docker-nightly"
