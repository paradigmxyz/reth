[package]
name = "ef-tests"
version.workspace = true
description = "EF testing support for reth."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
ef-tests = []
asm-keccak = [
    "alloy-primitives/asm-keccak",
    "reth-engine-tree/asm-keccak",
    "reth-node-core/asm-keccak",
    "reth-node-ethereum/asm-keccak",
    "reth-evm/asm-keccak",
    "reth-evm-ethereum/asm-keccak",
]
bn254-mcl = [
    "reth-evm/bn254-mcl",
    "reth-evm-ethereum/bn254-mcl",
    "reth-node-ethereum/bn254-mcl",
]

[dependencies]
reth-chain-state.workspace = true
reth-chainspec.workspace = true
reth-consensus.workspace = true
reth-db = { workspace = true, features = ["mdbx", "test-utils", "disable-lock"] }
reth-db-api.workspace = true
reth-db-common.workspace = true
reth-engine-primitives.workspace = true
reth-engine-tree.workspace = true
reth-eth-wire-types.workspace = true
reth-ethereum-consensus.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm = { workspace = true, features = ["blst", "c-kzg", "p256-aws-lc-rs"] }
reth-evm-ethereum = { workspace = true, features = ["std", "blst", "c-kzg", "p256-aws-lc-rs"] }
reth-network-api.workspace = true
reth-network-p2p.workspace = true
reth-node-core.workspace = true
reth-node-ethereum.workspace = true
reth-node-types.workspace = true
reth-payload-builder.workspace = true
reth-primitives-traits = { workspace = true, features = ["rayon"] }
reth-provider = { workspace = true, features = ["test-utils"] }
reth-prune.workspace = true
reth-rpc-api.workspace = true
reth-rpc-engine-api.workspace = true
reth-stages-api.workspace = true
reth-static-file.workspace = true
reth-storage-overlay.workspace = true
reth-tasks.workspace = true
reth-transaction-pool.workspace = true
reth-trie-db.workspace = true
reth-trie.workspace = true

alloy-consensus.workspace = true
alloy-eip7928 = { workspace = true, features = ["serde"] }
alloy-eips.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-engine.workspace = true

futures.workspace = true
jsonrpsee = { workspace = true, features = ["server-core"] }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream.workspace = true
tracing.workspace = true
walkdir.workspace = true

[dev-dependencies]
reth-tracing.workspace = true
tokio = { workspace = true, features = ["test-util"] }
