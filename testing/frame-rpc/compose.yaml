services:
  reth:
    build:
      context: ../..
      dockerfile: testing/frame-rpc/Dockerfile
    command:
      - node
      - --dev
      - --dev.block-time=1s
      - --chain=/config/genesis.json
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3
      - --disable-discovery
    volumes:
      - ./genesis.json:/config/genesis.json:ro
    tmpfs:
      - /data
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      RPC_URL: http://reth:8545
    depends_on:
      - reth
