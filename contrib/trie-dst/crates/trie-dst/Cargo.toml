[package]
name = "trie-dst"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reth-chain-state = { path = "../../../../crates/chain-state" }
reth-chainspec = { path = "../../../../crates/chainspec" }
reth-db-common = { path = "../../../../crates/storage/db-common" }
reth-db-api = { path = "../../../../crates/storage/db-api" }
reth-engine-tree = { path = "../../../../crates/engine/tree" }
reth-ethereum-primitives = { path = "../../../../crates/ethereum/primitives" }
reth-execution-types = { path = "../../../../crates/evm/execution-types" }
reth-primitives-traits = { version = "0.8.2" }
reth-provider = { path = "../../../../crates/storage/provider", features = ["test-utils"] }
reth-stages-types = { path = "../../../../crates/stages/types" }
reth-storage-overlay = { path = "../../../../crates/storage/storage-overlay", features = ["rayon"] }
reth-tasks = { path = "../../../../crates/tasks", features = ["rayon", "test-utils"] }
reth-trie = { path = "../../../../crates/trie/trie" }
alloy-consensus = "2.5.0"
alloy-primitives = "1.6.1"
alloy-rlp = "0.3.16"
alloy-trie = "0.9.8"
eyre = "0.6"
metrics-util = { version = "0.20.3", default-features = false, features = ["debugging"] }
rand = "0.9"
revm = { version = "43.0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
