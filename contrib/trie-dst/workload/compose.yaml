services:
  reth-trie-dst:
    image: bedrock/reth-trie-dst:latest
    pull_policy: never
    container_name: reth-trie-dst
    privileged: true
    environment:
      BEDROCK_COVERAGE_DIR: /bedrock/coverage
      RAYON_NUM_THREADS: "1"
    volumes:
      - /bedrock/in:/bedrock/in:ro
      - /bedrock/out:/bedrock/out
